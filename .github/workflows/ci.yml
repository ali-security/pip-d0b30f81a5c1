name: CI

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: "Optional pytest selector; when set, only these tests run"
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

# Newer git runs auto-maintenance detached in the background after commits; its
# transient .git/objects/maintenance.lock races scripttest's before/after file
# scan in the VCS functional tests (FileNotFoundError). Disable it for all git
# calls (these env vars survive the tests' isolated HOME/GIT_CONFIG_NOSYSTEM).
env:
  GIT_CONFIG_COUNT: "2"
  GIT_CONFIG_KEY_0: maintenance.auto
  GIT_CONFIG_VALUE_0: "false"
  GIT_CONFIG_KEY_1: gc.auto
  GIT_CONFIG_VALUE_1: "0"

jobs:
  docs:
    name: docs
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install nox
      - run: nox -s docs

  determine-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tests: ${{ steps.filter.outputs.tests }}
      vendoring: ${{ steps.filter.outputs.vendoring }}
    steps:
      # For pull requests it's not necessary to checkout the code
      - uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            vendoring:
              # Anything that's touching "vendored code"
              - "src/pip/_vendor/**"
              - "pyproject.toml"
              - "noxfile.py"
            tests:
              # Anything that's touching code-related stuff
              - ".github/workflows/ci.yml"
              - "src/**"
              - "tests/**"
              - "noxfile.py"
        if: github.event_name == 'pull_request'

  packaging:
    name: packaging
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Set up git credentials
        run: |
          git config --global user.email "pypa-dev@googlegroups.com"
          git config --global user.name "pip"

      - run: pip install nox
      - run: nox -s prepare-release -- 99.9
      - run: nox -s build-release -- 99.9
      - run: pipx run check-manifest

  release-dists:
    name: release distributions
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      # Build tooling pinned to pip 24.0's release date (2024-02-03) so the
      # sdist/wheel metadata matches the published 24.0 artifacts
      # (WHEEL Generator: bdist_wheel (0.42.0)). Python 3.10 because the
      # published wheel's entry_points.txt has a `pip3.10` console script,
      # i.e. it was built with Python 3.10. setuptools is pinned explicitly
      # because the toolcache Python preinstalls a newer one that would
      # otherwise be "already satisfied" (and write `Generator: setuptools`).
      - name: Install build tooling
        run: >-
          python -m pip install
          --index-url 'https://:2024-02-03T09:53:09Z@time-machines-pypi.sealsecurity.io/'
          build setuptools==69.0.3 wheel==0.42.0
      - name: Build sdist and wheel
        run: python -m build --no-isolation --outdir "${{ runner.temp }}/release-dist" .
      - uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: ${{ runner.temp }}/release-dist/
          if-no-files-found: error

  vendoring:
    name: vendoring
    runs-on: ubuntu-latest
    timeout-minutes: 30

    needs: [determine-changes]
    if: >-
      needs.determine-changes.outputs.vendoring == 'true' ||
      github.event_name != 'pull_request'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - run: pip install nox
      - run: nox -s vendoring
      - run: git diff --exit-code

  tests-unix:
    name: tests / ${{ matrix.python.key || matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}-latest
    timeout-minutes: 50

    needs: [packaging, determine-changes]
    if: >-
      needs.determine-changes.outputs.tests == 'true' ||
      github.event_name != 'pull_request'

    strategy:
      fail-fast: false
      matrix:
        os: [Ubuntu, MacOS]
        python:
          - "3.7"
          - "3.8"
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
        exclude:
          # CPython 3.7 has no Apple Silicon support: built on the arm64 macOS
          # runner it lacks _ctypes ("No module named '_ctypes'"), and no
          # Intel macOS runner remains. 3.7 is still covered on Ubuntu/Windows.
          - os: MacOS
            python: "3.7"

    steps:
      - uses: actions/checkout@v4
      # MatteoH2O1999/setup-python builds EOL CPython (3.7 on Ubuntu 24.04,
      # 3.7/3.8 on arm64 macOS) that actions/setup-python no longer provides.
      # On macOS, Python < 3.10 is always built from source: the toolcache
      # now ships python.org *framework* builds, and the legacy virtualenv
      # (< 20, used by the test suite for Python < 3.10) creates broken envs
      # from them ("It thinks sys.prefix is ..."); the source build is a
      # non-framework --enable-shared build, like the 2024 toolcache was.
      # CPython 3.8 builds against openssl@1.1, which Homebrew core
      # removed; the rbenv tap still carries the formula.
      - name: Provide openssl@1.1 for the CPython 3.8 source build
        if: matrix.os == 'MacOS' && matrix.python == '3.8'
        run: brew install rbenv/tap/openssl@1.1
      - uses: MatteoH2O1999/setup-python@v4
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
          cache-build: true
          allow-build: ${{ (matrix.os == 'MacOS' && contains(fromJSON('["3.7", "3.8", "3.9"]'), matrix.python)) && 'force' || 'allow' }}

      - name: Install Ubuntu dependencies
        if: matrix.os == 'Ubuntu'
        run: |
          sudo apt-get install bzr
          # Ubuntu 24.04's bzr is breezy's launcher embedding the system
          # libpython; setup-python's LD_LIBRARY_PATH/PATH make it pick up the
          # toolcache Python instead ("No module named 'breezy'"), so wrap it.
          printf '#!/bin/sh\nexec env -u LD_LIBRARY_PATH PATH="/usr/bin:/bin:$PATH" /usr/bin/brz "$@"\n' | sudo tee /usr/local/bin/bzr > /dev/null
          sudo chmod +x /usr/local/bin/bzr
          bzr version --short
          # The runner image's /etc/pip.conf sets break-system-packages = true,
          # which leaks into the test venvs and disables the PEP 668 check
          # that test_pep668.py::test_fails exercises.
          sudo rm -f /etc/pip.conf

      - name: Install MacOS dependencies
        if: matrix.os == 'MacOS'
        run: brew install breezy

      - run: pip install nox

      # Main check
      - name: Run unit tests
        run: >-
          nox -s test-${{ matrix.python.key || matrix.python }} --
          ${{ inputs.test-filter == '' && '-m unit' || inputs.test-filter }}
          --verbose --numprocesses auto --showlocals
      - name: Run integration tests
        if: inputs.test-filter == ''
        run: >-
          nox -s test-${{ matrix.python.key || matrix.python }} --
          -m integration
          --verbose --numprocesses auto --showlocals
          --durations=5

  tests-windows:
    name: tests / ${{ matrix.python }} / ${{ matrix.os }} / ${{ matrix.group }}
    runs-on: ${{ matrix.os }}-latest
    timeout-minutes: 50

    needs: [packaging, determine-changes]
    if: >-
      needs.determine-changes.outputs.tests == 'true' ||
      github.event_name != 'pull_request'

    strategy:
      fail-fast: false
      matrix:
        os: [Windows]
        python:
          - "3.7"
          # Commented out, since Windows tests are expensively slow.
          # - "3.8"
          # - "3.9"
          # - "3.10"
          - "3.11"
        group: [1, 2]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # We use C:\Temp (which is already available on the worker)
      # as a temporary directory for all of the tests because the
      # default value (under the user dir) is more deeply nested
      # and causes tests to fail with "path too long" errors.
      - run: pip install nox
        env:
          TEMP: "C:\\Temp"

      # Main check
      - name: Run unit tests
        if: matrix.group == 1
        run: >-
          nox -s test-${{ matrix.python }} --
          ${{ inputs.test-filter == '' && '-m unit' || inputs.test-filter }}
          --verbose --numprocesses auto --showlocals
        env:
          TEMP: "C:\\Temp"

      - name: Run integration tests (group 1)
        if: matrix.group == 1 && inputs.test-filter == ''
        run: >-
          nox -s test-${{ matrix.python }} --
          -m integration -k "not test_install"
          --verbose --numprocesses auto --showlocals
        env:
          TEMP: "C:\\Temp"

      - name: Run integration tests (group 2)
        if: matrix.group == 2 && inputs.test-filter == ''
        run: >-
          nox -s test-${{ matrix.python }} --
          -m integration -k "test_install"
          --verbose --numprocesses auto --showlocals
        env:
          TEMP: "C:\\Temp"

  tests-zipapp:
    name: tests / zipapp
    runs-on: ubuntu-latest
    timeout-minutes: 50

    needs: [packaging, determine-changes]
    if: >-
      needs.determine-changes.outputs.tests == 'true' ||
      github.event_name != 'pull_request'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Ubuntu dependencies
        run: |
          sudo apt-get install bzr
          # See tests-unix: wrap Ubuntu 24.04's bzr so it ignores the
          # toolcache Python, and drop the image's break-system-packages
          # /etc/pip.conf so the PEP 668 tests see a pristine config.
          printf '#!/bin/sh\nexec env -u LD_LIBRARY_PATH PATH="/usr/bin:/bin:$PATH" /usr/bin/brz "$@"\n' | sudo tee /usr/local/bin/bzr > /dev/null
          sudo chmod +x /usr/local/bin/bzr
          bzr version --short
          sudo rm -f /etc/pip.conf

      # No 'virtualenv<20' here: nox would build its session venv with legacy
      # virtualenv, whose stub site.py lacks site.getsitepackages(), which the
      # current pip that tools/protected_pip.py installs requires.
      - run: pip install nox 'setuptools != 60.6.0'

      # Main check
      - name: Run integration tests
        if: inputs.test-filter == ''
        run: >-
          nox -s test-3.10 --
          -m integration
          --verbose --numprocesses auto --showlocals
          --durations=5
          --use-zipapp

  check:  # This job does nothing and is only used for the branch protection
    if: always()

    needs:
      - determine-changes
      - docs
      - packaging
      - tests-unix
      - tests-windows
      - tests-zipapp
      - vendoring
      - release-dists

    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@release/v1
        with:
          allowed-skips: >-
            ${{
              (
                needs.determine-changes.outputs.vendoring != 'true'
                && github.event_name == 'pull_request'
              )
              && 'vendoring'
              || ''
            }}
            ,
            ${{
              (
                needs.determine-changes.outputs.tests != 'true'
                && github.event_name == 'pull_request'
              )
              && '
                tests-unix,
                tests-windows,
                tests-zipapp,
                tests-importlib-metadata,
              '
              || ''
            }}
          jobs: ${{ toJSON(needs) }}
